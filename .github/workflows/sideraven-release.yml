name: Sideraven release

# A version tag (v1.0.0) builds the release, signs it with Sideraven's key and publishes it on
# GitHub Releases. The APK names stay the same every release, so Obtainium can track them.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0)'
        required: false
        # Standing rule: version must mirror the official upstream
        # (Dweep4269/sideraven) release exactly, never ahead of it.
        # Official is currently 1.1.0, so a rebuild intentionally
        # clobbers the existing v1.1.0 release asset with the new code.
        default: '1.1.0'

permissions:
  contents: write

concurrency:
  group: sideraven-release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 300
    name: Build, sign and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Prepare signing keystore
        env:
          KEYSTORE: ${{ secrets.SIDERAVEN_KEYSTORE_BASE64 }}
          ALIAS_INPUT: ${{ secrets.SIDERAVEN_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SIDERAVEN_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIDERAVEN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$ALIAS_INPUT" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "Using configured GitHub Secrets for signing."
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/sideraven.jks"
            echo "KEY_ALIAS=$ALIAS_INPUT" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            # Fail instead of generating a throwaway key: an APK signed
            # with a fresh key every run cannot update the installed app
            # and will not match the published certificate fingerprint.
            echo "::error::Signing secrets are missing. Set SIDERAVEN_KEYSTORE_BASE64, SIDERAVEN_KEY_ALIAS, SIDERAVEN_KEYSTORE_PASSWORD and SIDERAVEN_KEY_PASSWORD; nothing is published unsigned or under a throwaway key."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Version from tag or input
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="v$VERSION"
          else
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tags look like v1.0.0, not $GITHUB_REF_NAME"; exit 1; }
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="$GITHUB_REF_NAME"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "FENIX_VERSION=$(tr -d '\n' < version.txt)" >> "$GITHUB_ENV"
          if [ -f "app/src/main/assets/extensions/amoled_dark/manifest.json" ]; then
            python3 -c "import json; p='app/src/main/assets/extensions/amoled_dark/manifest.json'; d=json.load(open(p)); d['version']='$VERSION'; json.dump(d, open(p,'w'), indent=2)"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      # Fenix needs more disk than a runner starts with: remove toolchains we don't use.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          SWAP_DIR=$( [ -d /mnt ] && echo /mnt || echo / )
          sudo fallocate -l 6G $SWAP_DIR/sideraven-swap
          sudo chmod 600 $SWAP_DIR/sideraven-swap
          sudo mkswap $SWAP_DIR/sideraven-swap
          sudo swapon $SWAP_DIR/sideraven-swap
          df -h / $SWAP_DIR
          free -h

      # Cache the Android SDK: setup-gradle already caches the Gradle User Home
      # (dependencies + local build cache), but nothing cached the SDK, so every
      # run re-downloaded commandlinetools and re-installed the NDK and
      # build-tools. This cache is restored BEFORE the SDK install step, so
      # install-sdk.sh skips the commandlinetools download when it is present
      # and sdkmanager skips already-installed packages. The first build
      # after this change still downloads the SDK once to fill the cache;
      # later builds restore it instead. Keyed on the install script so an
      # SDK install change busts the cache on purpose.
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: sideraven-android-sdk-${{ runner.os }}-${{ hashFiles('automation/iceraven/install-sdk.sh') }}
          restore-keys: |
            sideraven-android-sdk-${{ runner.os }}-

      - name: Install Android SDK with pieces Gradle skips
        run: |
          ./automation/iceraven/install-sdk.sh
          # apksigner, for signing below (the build would only fetch build-tools as a side effect).
          $HOME/android-sdk/android-sdk-linux/cmdline-tools/tools/bin/sdkmanager "build-tools;36.0.0"

      - name: Prepare checkout, release strings
        run: ./automation/sideraven/prepare.sh --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Gradle User Home caching is on by default in setup-gradle; keep
          # it writing back (not read-only) so dispatch builds on main can
          # update the cache, and clean up unused files on success so the
          # cache does not grow without bound.
          cache-read-only: false
          cache-cleanup: on-success

      # Lint vital is skipped: it once crashed on Sideraven's code with an internal lint error, and
      # every change is already built and tested by Sideraven CI before it is tagged.
      - name: Build forkRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"
        run: >
          ./gradlew app:assembleForkRelease -PversionName="$VERSION"
          -x lintVitalForkRelease -x lintVitalAnalyzeForkRelease -x lintVitalReportForkRelease
          --stacktrace --no-daemon

      - name: Sign the APKs
        run: |
          apksigner=$(ls -d "$HOME"/android-sdk/android-sdk-linux/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          for apk in gradle/build/app/outputs/apk/forkRelease/app-*-forkRelease-unsigned.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-forkRelease-unsigned\.apk$/\1/')
            out="dist/sideraven-$VERSION-$abi.apk"
            "$apksigner" sign --ks "$RUNNER_TEMP/sideraven.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$apk"
            "$apksigner" verify "$out"
          done
          rm -f "$RUNNER_TEMP/sideraven.jks"
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version's changelog (docs/changelog/<version>.md), when there is one, goes between the two lines.
          {
            echo "Sideraven $VERSION, based on Firefox for Android $FENIX_VERSION."
            echo
            if [ -f "docs/changelog/$VERSION.md" ]; then
              cat "docs/changelog/$VERSION.md"
              echo
            fi
            echo "- Full AMOLED Dark Mode (True #000000 background for UI & Webpages)"
            echo "- Balanced 36dp compact toolbar & address bar"
            echo "- Optimized ARM64-v8a build"
            echo
            echo "Download \`sideraven-$VERSION-arm64-v8a.apk\`."
          } > notes.md
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.apk --clobber
            gh release edit "$TAG_NAME" --title "Sideraven $VERSION" --notes-file notes.md
          else
            gh release create "$TAG_NAME" dist/*.apk --title "Sideraven $VERSION" --notes-file notes.md
          fi
